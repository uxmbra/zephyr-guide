name: zephyr-guide
services:
  guide:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:4173:80"
    volumes:
      - type: bind
        source: ./dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
