server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ~ (^|/)\. { deny all; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
